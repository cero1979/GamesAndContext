name: Reproduce results

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e .
      - run: python scripts/build_notebook.py
      - run: python scripts/run_all.py
      - name: Verify committed artifacts
        run: git diff --exit-code -- results notebooks/reproduce_context_dependent_benefit_loss_games_v09.ipynb

  contextual-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-qq-lock.txt
      - run: python -m pip install -r requirements-qq-lock.txt
      - name: Test analytic restrictions and regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Regenerate synthetic diagnostics
        run: python scripts/run_qq_audit.py --output-dir "$RUNNER_TEMP/qq-results"
